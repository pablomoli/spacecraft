<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640">
  <!-- PM rocket mark, geometry measured off the approved reference render.
       Mark axis x=160; the P's stem sits LEFT of axis (x 105..141), bowl bulges right,
       M centered on the axis. Layer order matters: nozzle, then blue M (its vertex
       overlaps the bell), then silver P on top so the spear covers the V's left edge. -->

  <!-- background: preview only, delete before export to transparent contexts -->
  <rect id="bg" width="320" height="640" fill="#01040A"/>

  <!-- flame: thick-walled hollow teardrop (evenodd keeps the core transparent) -->
  <path id="flame" fill="#FDBD50" fill-rule="evenodd" d="M160 548
    C 182 568, 186 598, 160 632
    C 134 598, 138 568, 160 548 Z
    M160 560
    C 170 570, 171 586, 160 606
    C 149 586, 150 570, 160 560 Z"/>

  <!-- nozzle bell: drawn before the M so the vertex overlaps its throat -->
  <path id="nozzle" fill="#3FB9EA" d="M152 485 L168 485 L190 548 L130 548 Z"/>
  <path id="nozzle-shade" fill="#1096CC" d="M160 485 L168 485 L190 548 L160 548 Z"/>

  <!-- M: apexes y=322, one deep central V to (160,428), slit wedges from y=396,
       fin outer edges bow outward to tips at y=548, bottom vertex (160,505) -->
  <path id="m" fill="#3FB9EA" d="M93 322
    L160 428 L227 322
    C 250 390, 290 460, 303 548
    L222 466 L221 396
    L167 492 L160 505 L153 492
    L99 396 L98 466
    L17 548
    C 30 460, 70 390, 93 322 Z"/>

  <!-- shadow facet: outer strip of the right leg, ridge from apex to fin tip -->
  <path id="m-shade" fill="#1096CC" d="M227 322 L250 412 L298 539 L303 548
    C 290 460, 250 390, 227 322 Z"/>

  <!-- P: blade cone + stem + bowl, counter as evenodd hole. Outer path: tip, blade
       edge into the bowl sweep, bowl closes at (160,290), stem right edge x=141
       down to the spear tip (137,380), long cut back up the straight left edge. -->
  <path id="p" fill="#CFCFD3" fill-rule="evenodd" d="M160 10
    C 172 42, 202 88, 209 122
    C 233 142, 246 168, 246 205
    C 246 252, 213 278, 160 290
    L141 294 L141 372 L137 380
    L105 295
    L105 118
    C 109 86, 148 42, 160 10 Z
    M141 158
    C 190 158, 209 176, 209 201
    C 209 227, 190 244, 141 244 Z"/>

  <!-- cone facets: bright left face, shadowed right sliver, ridge from the tip to x=182 -->
  <path id="cone-light" fill="#D8D8DB" d="M160 10
    C 148 42, 109 86, 105 118
    L182 120 Z"/>
  <path id="cone-shade" fill="#B9BABD" d="M160 10
    C 172 42, 202 88, 209 122
    L182 120 Z"/>
</svg>
